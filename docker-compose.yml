services:
  admin:
    build: ./apps/admin
    ports:
      - "5173:5173"
    depends_on:
      - api

  ingest:
    profiles: [recording]
    build: ./apps/ingest-rs
    environment:
      RTSP_URL: ${RTSP_URL:?set RTSP_URL in .env}
      OUTPUT_DIR: /data/recordings
      SEGMENT_SECONDS: 60
    volumes:
      - ./data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pet_ai
      POSTGRES_USER: pet_ai
      POSTGRES_PASSWORD: pet_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://pet_ai:pet_ai@postgres:5432/pet_ai
      REDIS_URL: redis://redis:6379
      AI_WORKER_URL: http://ai-worker:8001
      RTSP_URL: ${RTSP_URL:?set RTSP_URL in .env}
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    depends_on:
      - postgres
      - redis
      - ai-worker

  ai-worker:
    build: ./apps/ai-worker
    gpus: all
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://pet_ai:pet_ai@postgres:5432/pet_ai
      MODEL_PATH: /models/yolo11n-pose.pt
      DOG_MODEL_PATH: /models/yolo11n.pt
      DEVICE: ${AI_DEVICE:-cuda}
      RTSP_URL: ${RTSP_URL:?set RTSP_URL in .env}
    ports:
      - "8001:8001"
    volumes:
      - ./models:/models
      - ./data:/data
    depends_on:
      - redis
      - postgres

volumes:
  postgres_data:
